<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="left">
        <div class="logo-box">
          <img
            src="./assets/images/logo.png"
            alt="ODIN Logo"
            width="75"
            height="100"
          />
          <h1 class="logo-box__heading">ODIN</h1>
        </div>
        <p class="left__paragraph">
          Photo by
          <a
            href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            class="left__link"
            >Halie West</a
          >
          on
          <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            class="left__link"
            >Unsplash</a
          >
        </p>
      </section>
      <section class="right">
        <p class="top-text">
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepset dreams. <br />
          Sign up
          <em>now</em>
          to get started. <br />
          <br />
          You <span class="italic">know</span> you want to.
        </p>

        <form action="#" method="post" class="form">
          <h2 class="form__heading">Let's do this!</h2>

          <div class="inputs">
            <div class="input-box">
              <label for="first-name" class="label">First Name</label>
              <input
                type="text"
                class="input"
                name="first-name"
                id="first-name"
                required
              />
            </div>

            <div class="input-box">
              <label for="last-name" class="label">Last Name</label>
              <input
                type="text"
                class="input"
                name="last-name"
                id="last-name"
                required
              />
            </div>

            <div class="input-box">
              <label for="email" class="label">Email</label>
              <input
                type="email"
                class="input"
                name="email"
                id="email"
                required
              />
            </div>

            <div class="input-box">
              <label for="phone-number" class="label">Phone Number</label>
              <input
                type="tel"
                class="input"
                name="phone-number"
                id="phone-number"
                pattern="^\+?[1-9]\d{1,14}$"
                required
              />
            </div>

            <div class="input-box">
              <label for="password" class="label">Password</label>
              <input
                type="password"
                class="input password"
                name="password"
                id="password"
                required
              />
            </div>

            <div class="input-box">
              <label for="confirm-password" class="label"
                >Confirm Password</label
              >
              <input
                type="password"
                class="input password"
                name="confirm-password"
                id="confirm-password"
                required
              />
            </div>
          </div>

          <button type="submit" class="button">Create Account</button>
        </form>

        <p class="bottom-text">
          Already have an account?
          <a href="#" class="bottom-text__link">Log in</a>
        </p>
      </section>
    </main>
  </body>
</html>
